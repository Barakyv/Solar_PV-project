<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Figure book</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui,sans-serif;margin:16px;background:#fff;color:#111}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}figure{margin:0;border:1px solid #ddd;border-radius:8px;padding:10px}figure.correction{border-color:#D55E00}img{width:100%;height:auto}figcaption{font-size:12px;color:#444;margin-top:6px}#sel{position:sticky;top:0;background:#fff;padding:8px 0}</style></head><body><h1>Figure book</h1><div id="sel">Selected: <span id="ids"></span> <button onclick="navigator.clipboard.writeText(document.getElementById('ids').textContent)">Copy IDs</button></div><main><figure class="process"><label><input type="checkbox" value="S00-01"> <b>S00-01</b> Raw export: minutes per monthly file against the calendar</label><a href="stage_00/S00-01_raw_inventory.png"><img src="stage_00/S00-01_raw_inventory.png" alt="Bars: rows in each of the monthly files minus the minutes of that calendar month. October files have extra rows and March files have missing rows; every other month is exact." loading="lazy"></a><figcaption>45 monthly files with 1,971,360 rows. Only the daylight-saving months deviate: 4 October files with +60 rows and 4 March files with -60 rows; no other file has a missing or duplicate minute.<br><i>Led to:</i> The export is written in local wall-clock time, so stage 2 converts it to UTC with the daylight-saving rule instead of dropping or averaging the repeated hour.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S01-01"> <b>S01-01</b> The pipeline, stage by stage</label><a href="stage_01/S01-01_pipeline.png"><img src="stage_01/S01-01_pipeline.png" alt="Twelve boxes in reading order, each with the stage&#x27;s main output; finished stages solid, the current stage outlined in orange, later stages hatched." loading="lazy"></a><figcaption>From 45 raw files to 1,971,360 UTC minutes, 32,856 hourly rows, 74 / 67 / 60 candidate features per horizon plus 1,371 weather-forecast runs, and 31 (indirect) and 96 (direct) model inputs at D+1. The final training of the six models comes only after the gate.<br><i>Led to:</i> Each stage is built and checked before the next one starts; the final training runs once on frozen code after gate G-1 (D-08).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S01-02"> <b>S01-02</b> Train, validation and test periods</label><a href="stage_01/S01-02_splits.png"><img src="stage_01/S01-02_splits.png" alt="Three consecutive bars on a calendar axis with the hours and the daytime hours of each period. The test period is hatched: it is read only in the final run." loading="lazy"></a><figcaption>Chronological split without shuffling: train 21,195 hours (9,698 daytime), validation 5,832 (2,902 daytime), test 5,832 (2,580 daytime). Every selection and tuning step uses train and validation only.<br><i>Led to:</i> The split fixed the evaluation rule of every later stage: decisions on validation, the test period opened once in the final run after the code is frozen (D-08).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S01-03"> <b>S01-03</b> The feature contract and the leakage list</label><a href="stage_01/S01-03_feature_contract.png"><img src="stage_01/S01-03_feature_contract.png" alt="Left: allowed features per group. Right: features available at each horizon, after the power lags that are not known at issuance are removed." loading="lazy"></a><figcaption>74 allowed features in 5 groups; 74 / 67 / 60 remain at D+1 / D+2 / D+3. The leakage list blocks 47 exact names and 13 name patterns (same-hour power, flags, quality columns, set-points).<br><i>Led to:</i> An allow-list, not a block-list, decides what reaches a model; the leakage tests run on every table and model input from stage 6 on.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S02-01"> <b>S02-01</b> Daylight-saving days on a continuous UTC grid</label><a href="stage_02/S02-01_dst_utc_grid.png"><img src="stage_02/S02-01_dst_utc_grid.png" alt="Minutes per local wall-clock hour on the first autumn and the first spring transition day (bars), against the 60 minutes that every UTC hour holds (dashed line)." loading="lazy"></a><figcaption>1,971,360 UTC minutes from 2021-08-31 21:00 to 2025-05-31 20:59, every UTC hour with exactly 60 minutes. On the 4 autumn days the local hour 01:00 holds 120 minutes (two distinct UTC hours); on the 4 spring days 02:00 local does not exist.<br><i>Led to:</i> All later stages work on this one UTC grid, so daily and hourly features never mix two clocks.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S02-02"> <b>S02-02</b> Value anomalies found at ingestion</label><a href="stage_02/S02-02_raw_anomalies.png"><img src="stage_02/S02-02_raw_anomalies.png" alt="Minutes affected per anomaly type, on a logarithmic axis because the counts range from a few minutes to tens of thousands." loading="lazy"></a><figcaption>No missing or non-numeric cell. Temperature sensors carry a fault code (minimum -270) in 2,649-2,941 minutes each; irradiance is slightly negative at night in 56,222 minutes; 4 inverter minutes exceed 110 % of the inverter rating (up to 40,825 kW).<br><i>Led to:</i> Each anomaly type became an explicit cleaning rule with evidence for its threshold (stage 3b) and a logged effect (stage 5).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S02-03"> <b>S02-03</b> Production centre against solar noon after the UTC conversion</label><a href="stage_02/S02-03_centroid_after_utc.png"><img src="stage_02/S02-03_centroid_after_utc.png" alt="Each point is one clear day: the centre of the DC power curve (circles) and of the irradiance curve (triangles) minus solar noon, in minutes." loading="lazy"></a><figcaption>On 270 clear days the monthly medians stay within 13.2 min of solar noon (the stage-2 check allows 30), so the UTC conversion is right; but the medians drift from month to month (irradiance sensor -13.2 to 4.4 min) and the DC and irradiance medians differ by up to 6.7 min in the same month.<br><i>Led to:</i> The residual drift pointed to the logger clocks themselves: the per-day clock study (F-15) and the per-source correction of stage 4 (D-19).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S04-01"> <b>S04-01</b> Logger clock offsets applied per day</label><a href="stage_04/S04-01_clock_offsets.png"><img src="stage_04/S04-01_clock_offsets.png" alt="Daily offset (time stamp minus true time) of the weather-station clock (solid), the inverter clock (dashed) and the clock of the second data source (dotted), with the two re-synchronisations marked." loading="lazy"></a><figcaption>Over 1,369 days the weather-station clock drifts down to -15.9 min and the inverter clock to -15.9 min; the clocks were re-synchronised on 2023-05-09 (weather station only) and 2024-01-21. The second source, from 2025-02-26, keeps its own clock (-3.7 to -1.9 min).<br><i>Led to:</i> Every minute is shifted by its own clock&#x27;s offset of that day before the hourly means, so power, irradiance and the sun share one time base (D-19).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S04-02"> <b>S04-02</b> Clock check after the correction</label><a href="stage_04/S04-02_clock_check.png"><img src="stage_04/S04-02_clock_check.png" alt="Monthly median of the clear-day offset of the irradiance sensor against the clear-sky model (left) and of the inverter clock against the weather-station clock (right), before (triangles, dashed) and after (circles) the correction, with the acceptance bands." loading="lazy"></a><figcaption>After the correction every one of the 43 months is inside the bands: the irradiance offset is at most 1.74 min (before: up to 15.9) and the inverter-to-station gap at most 0.70 min (before: up to 12.0).<br><i>Led to:</i> With the clocks aligned, the panel orientation was re-measured on the corrected data (21 degrees tilt, 185 degrees azimuth) and the hourly tables were built.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S04-03"> <b>S04-03</b> The second data source: values held for 15 minutes</label><a href="stage_04/S04-03_second_source.png"><img src="stage_04/S04-03_second_source.png" alt="Share of daytime minutes per day in which inverter-1 AC power repeats the previous minute exactly, over the whole period with the splits shaded." loading="lazy"></a><figcaption>Before 2025-02-26, the first day of the second source, the daily median of repeated minutes is 0.0%; from that day on it is 86.6% (95 days, the two sources mixed hour by hour at first). The file still has a row per minute, but the value is a snapshot refreshed every 15 minutes.<br><i>Led to:</i> The second source was detected per tag and hour, rebuilt at its sampling instants with its own clock (D-20), and evaluated separately (D-21).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S05-01"> <b>S05-01</b> What each cleaning rule changed</label><a href="stage_05/S05-01_cleaning_rules.png"><img src="stage_05/S05-01_cleaning_rules.png" alt="Minutes set to missing or corrected by each rule (all columns), split into daytime and night minutes, on a logarithmic axis." loading="lazy"></a><figcaption>6 value rules touched 557,092 minutes; the largest is the pyranometer scale fault (409,160 minutes, a QA sensor that no model uses). On the power columns the rules changed 123,154 kWh, most of it in logger freezes that had repeated a value for hours.<br><i>Led to:</i> The cleaned minutes were re-aggregated to hours, and hours with downtime, curtailment or a partial inverter outage were flagged rather than deleted (D-22).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S05-02"> <b>S05-02</b> Operationally limited daytime hours per month</label><a href="stage_05/S05-02_operational_flags.png"><img src="stage_05/S05-02_operational_flags.png" alt="Daytime hours per month carrying the operational flag, by cause: grid curtailment, inverter stop, partial inverter outage; the splits are shaded." loading="lazy"></a><figcaption>379 flagged daytime hours in train, 146 in validation and 186 in test: 218 curtailment, 157 stops and 336 partial outages in total.<br><i>Led to:</i> Flagged hours stay in the data and in the main evaluation, but are left out of the training loss and set to missing in the past-day features (D-22).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S06-01"> <b>S06-01</b> From power to the clear-sky index on two days</label><a href="stage_06/S06-01_target_construction.png"><img src="stage_06/S06-01_target_construction.png" alt="Top: measured AC power and the clear-sky power of the panel plane on a clear and a cloudy day of {month} (train). Bottom: their hourly ratio, the clear-sky index k, on daytime hours." loading="lazy"></a><figcaption>On the clear day (2022-03-13) the measured power follows the clear-sky curve: the daily k is 0.94, with hourly values from 0.87 to 1.25 (the highest at low sun). On the cloudy day (2022-03-15) the daily k is 0.54 and the hourly k drops to 0.30. Dividing by the clear-sky power removes the daily and seasonal shape and leaves the weather.<br><i>Led to:</i> k is the indirect target; it is converted back to kW by multiplying with the same clear-sky power, exactly, so both routes are scored in kW (F-06 fix, T-11).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S06-02"> <b>S06-02</b> Choosing the clear-sky reference of the target</label><a href="stage_06/S06-02_clear_sky_reference.png"><img src="stage_06/S06-02_clear_sky_reference.png" alt="The three criteria fixed before the comparison, for the horizontal (GHI) and the panel-plane (POA) reference: share of train daytime hours with k above 1, spread of the monthly clear-day k, and validation error in kW of a fixed XGBoost (mean and SD of 3 seeds)." loading="lazy"></a><figcaption>The panel-plane reference wins all three: k above 1 in 5.4% of hours against 32.4%, a monthly clear-day spread of 0.108 against 0.413, and 7.94 % against 8.09 % of capacity on validation.<br><i>Led to:</i> k is defined against the panel-plane clear-sky power (D-11), with no clipping; the mean daytime k on train becomes the normalising constant of the indirect route.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S06-03"> <b>S06-03</b> The clear-sky index on train</label><a href="stage_06/S06-03_k_distribution.png"><img src="stage_06/S06-03_k_distribution.png" alt="Histogram of hourly k on valid daytime train hours in bins of 0.025, with the mean daytime k used to normalise the indirect error." loading="lazy"></a><figcaption>9,656 valid daytime train hours, one peak near 0.84, mean daytime k 0.788. Only 0.61% of hours exceed 1.2, 100% of them with the sun below 15 degrees, and no value sits at a cap, so k is kept as measured.<br><i>Led to:</i> No clipping: k converts back to the measured kW exactly, and the same rows feed the training masks of stage 9.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S06-04"> <b>S06-04</b> Which past days each horizon may use</label><a href="stage_06/S06-04_history_per_horizon.png"><img src="stage_06/S06-04_history_per_horizon.png" alt="One row per horizon; columns are local days relative to the issuance midnight (dashed line). Filled squares: the power and weather lags allowed at that horizon; bars below: the 3- and 7-day same-hour windows." loading="lazy"></a><figcaption>Lags allowed, in days back from the target day: D+1: 1, 2, 3, 7, 14; D+2: 2, 3, 7, 14; D+3: 3, 7, 14. The same-hour windows always end on the last day before issuance (day 0), whatever the horizon.<br><i>Led to:</i> Every history feature is built from days known at issuance, and a test plants a future day to check that it is caught (T-09, T-18).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S06-05"> <b>S06-05</b> The candidate feature table per horizon</label><a href="stage_06/S06-05_feature_table.png"><img src="stage_06/S06-05_feature_table.png" alt="Stacked bars: candidate features per group at each horizon (contract only, before the weather forecasts are added)." loading="lazy"></a><figcaption>74 / 67 / 60 candidates at D+1 / D+2 / D+3; only the power and weather lags shrink with the horizon. At most 3.56% of any feature&#x27;s values are filled from the same hour of the previous 30 days.<br><i>Led to:</i> The table goes to feature selection together with the weather-forecast candidates of stage 6b.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S6b-01"> <b>S6b-01</b> Forecast runs public before the issuance time</label><a href="stage_6b/S6b-01_forecast_availability.png"><img src="stage_6b/S6b-01_forecast_availability.png" alt="Histogram of the time between the upload of the last file of the run used for each day and the issuance time; runs that replaced a late 12Z run are counted separately." loading="lazy"></a><figcaption>1,369 issuance days; the run used was uploaded 1.1 to 12.0 hours before issuance (median 5.1 h). 2 days use the earlier 06Z run, because their 12Z files had been uploaded again after issuance.<br><i>Led to:</i> Only runs public before issuance enter the features (T-17); the check reads the upload time of every file, not the nominal run time.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S6b-02"> <b>S6b-02</b> Forecast agreement with the measured clear-sky index</label><a href="stage_6b/S6b-02_gfs_agreement.png"><img src="stage_6b/S6b-02_gfs_agreement.png" alt="Correlation between the forecast clear-sky index on the panel plane and the measured k, per hour and per day, at each horizon (train and validation days)." loading="lazy"></a><figcaption>Daily correlation 0.82 / 0.79 / 0.74 and hourly 0.64 / 0.62 / 0.58 at D+1 / D+2 / D+3 over 1,124 days: a real, imperfect forecast that weakens with lead time.<br><i>Led to:</i> The forecast variables became candidates for feature selection, after the value test of S6b-03.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S6b-03"> <b>S6b-03</b> Value of the weather forecasts on validation</label><a href="stage_6b/S6b-03_gfs_value.png"><img src="stage_6b/S6b-03_gfs_value.png" alt="Validation nRMSE in kW of a fixed XGBoost with the contract features alone (dashed, circles) and with the forecast variables added (solid, squares); mean and SD over 3 seeds." loading="lazy"></a><figcaption>Adding the forecasts lowers the error by 0.88 to 1.67 points of capacity at every horizon and in both routes, against a seed spread of at most 0.09.<br><i>Led to:</i> The forecasts were accepted (D-12) and entered feature selection as candidates.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S07-01"> <b>S07-01</b> Selected sets against the full candidate pool, inside train</label><a href="stage_07/S07-01_inner_train_check.png"><img src="stage_07/S07-01_inner_train_check.png" alt="Error of the selected set minus error of the full pool (points; negative is better) on two train-only samples, with the acceptance margin of each case (short bars)." loading="lazy"></a><figcaption>Indirect route: the selected set passes in 6 of 6 checks (difference -0.07 to +0.05 points). Direct route: it fails in 6 of 6 (the selected set is worse by 0.10 to 0.71 points), because its importance is concentrated in a few features and the stability floor kept too few.<br><i>Led to:</i> The indirect route takes its selected sets, the direct route takes the full pool (F-29); the decision was committed before validation was looked at.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S07-02"> <b>S07-02</b> Model inputs per route and horizon</label><a href="stage_07/S07-02_model_inputs.png"><img src="stage_07/S07-02_model_inputs.png" alt="Stacked bars: number of input features of each group for every route and horizon, as written in the model-input file read by stage 9." loading="lazy"></a><figcaption>Indirect route: 31 / 28 / 32 inputs at D+1 / D+2 / D+3, of which 16 are weather-forecast variables at D+1. Direct route: 96 / 89 / 82 (the full pool, 21 forecast variables at D+1).<br><i>Led to:</i> These lists are the input of every model of stage 9 and stage 10; the runner checks them against the tables they were selected on.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S08-01"> <b>S08-01</b> Which hours are scored</label><a href="stage_08/S08-01_evaluation_hours.png"><img src="stage_08/S08-01_evaluation_hours.png" alt="Sun elevation at the middle of each UTC hour on a winter and a summer validation day; hours above the 5-degree line (shaded) are scored." loading="lazy"></a><figcaption>An hour is scored when the sun is above 5 degrees at its middle: 10 hours on 2024-02-15 and 13 on 2024-06-21. Validation has 2,901 scored hours with a measured truth; every model and reference is scored on exactly these hours.<br><i>Led to:</i> One daytime rule from geometry only, the same for both routes and all models, so the errors are comparable (T-39).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S08-02"> <b>S08-02</b> Evaluation code checked on the surviving forecasts</label><a href="stage_08/S08-02_evaluation_code_check.png"><img src="stage_08/S08-02_evaluation_code_check.png" alt="For the one model whose forecasts survived (BiLSTM), the nRMSE computed by the new code minus the nRMSE in the submitted benchmark table, per route and horizon, with equal hour counts." loading="lazy"></a><figcaption>On the same forecasts the new code reproduces the submitted nRMSE within 0.0001 points (indirect) and 0.0012 points (direct), on the same 2,510-2,514 hours: the metric definitions did not change, so later differences come from the data and the models.<br><i>Led to:</i> The evaluation layer was then run on the rebuild&#x27;s own tables (validation only) with the references and statistical tests.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S08-03"> <b>S08-03</b> Reference forecasts on validation</label><a href="stage_08/S08-03_references.png"><img src="stage_08/S08-03_references.png" alt="Validation nRMSE in kW of the three references at each horizon (direct target)." loading="lazy"></a><figcaption>Climatology (8.04 %) beats persistence at every horizon (9.68 / 10.82 / 10.72 %), since a day says little about the next one; clear sky times the mean k gives 8.96 %. A model must beat climatology to be useful. The indirect-route references, converted to kW, differ from these by at most 0.04 points.<br><i>Led to:</i> These references are the yardstick of the skill scores and the significance tests of stage 9.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S09-01"> <b>S09-01</b> Run modes of the pipeline runner</label><a href="stage_09/S09-01_run_modes.png"><img src="stage_09/S09-01_run_modes.png" alt="Three run modes, the data each one may read, and the gate in front of the final run." loading="lazy"></a><figcaption>Smoke: a short slice to test the plumbing. Development: train and validation, 20 tuning trials, seed 42. Final: 60 trials, seeds 42, 123, 777, and the only mode that reads the test period, refused unless the code carries the frozen tag.<br><i>Led to:</i> Light models are developed in the dev mode until gate G-1; the final run of the six models happens once (stage 10).</figcaption></figure><figure class="process"><label><input type="checkbox" value="S09-02"> <b>S09-02</b> XGB development run against the references</label><a href="stage_09/S09-02_xgb_dev_vs_references.png"><img src="stage_09/S09-02_xgb_dev_vs_references.png" alt="Validation nRMSE in kW per horizon for the development XGBoost and the three references, for the indirect route (left, converted to kW) and the direct route (right)." loading="lazy"></a><figcaption>XGB-dev: 6.69 / 6.91 / 6.55 % (indirect) and 6.66 / 6.81 / 6.43 % (direct), below climatology (8.04 %) and persistence at every horizon. These are tuning-split numbers, optimistic by construction; the unbiased test comes once, in the final run.<br><i>Led to:</i> The pipeline runs end to end with a light model; the neural models are added next (W4) on the same datasets and scoring.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S09-03"> <b>S09-03</b> Monotone constraint on clear-sky irradiance</label><a href="stage_09/S09-03_monotone_check.png"><img src="stage_09/S09-03_monotone_check.png" alt="Validation nRMSE in kW of a fixed XGBoost with the constraint (A) and without it (B), three seeds each (points) and their means (bars), per horizon." loading="lazy"></a><figcaption>Dropping the constraint does not help: the gain is -0.029 / -0.005 / -0.006 points at D+1 / D+2 / D+3, against a pre-registered margin of 0.05 at D+1.<br><i>Led to:</i> The constraint stays in both routes as in the submitted study (D-15); its exact feature list is now checked against the trained model.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S09-04"> <b>S09-04</b> Linear correction of the forecast in kW</label><a href="stage_09/S09-04_linear_correction.png"><img src="stage_09/S09-04_linear_correction.png" alt="Validation nRMSE in kW before (circles) and after (squares) the correction a + b x forecast, fitted on out-of-fold train forecasts; three seeds per horizon and route." loading="lazy"></a><figcaption>Indirect route: the error drops by 0.11 / 0.22 / 0.09 points, above every margin, so the correction is adopted. Direct route: it rises by 0.06 / 0.13 / 0.11 points, so it is not used.<br><i>Led to:</i> The correction runs inside the XGB step for the indirect route, refitted on each run (L-09); the uncorrected forecast is kept beside it.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S09-05"> <b>S09-05</b> Are the differences significant? Diebold-Mariano in kW</label><a href="stage_09/S09-05_significance_kw.png"><img src="stage_09/S09-05_significance_kw.png" alt="Grid of the Bonferroni-corrected Diebold-Mariano tests (squared error in kW, HLN correction): each cell is XGB-dev against one reference at one horizon; the text is the p-value and the observed effect as a share of the minimum detectable effect." loading="lazy"></a><figcaption>XGB-dev is significantly better in 18 of 18 comparisons. Against climatology the effect is 93% to 110% of the minimum detectable effect: real, but modest.<br><i>Led to:</i> The kW table is the primary acceptance test of the final run (Q-19); the k-unit table is kept as secondary.</figcaption></figure><figure class="process"><label><input type="checkbox" value="S09-06"> <b>S09-06</b> Sequence datasets: one forecast origin per local day</label><a href="stage_09/S09-06_sequence_datasets.png"><img src="stage_09/S09-06_sequence_datasets.png" alt="Left: one forecast origin at local midnight, with the encoder history of each model and the decoder covering the next three local days. Right: decoder block lengths of the train and validation origins (23 and 25 hours on daylight-saving days)." loading="lazy"></a><figcaption>872 train and 246 validation origins, one per local day. Blocks are 3,324 days of 24 hours, 9 of 23 and 9 of 25; every check passed (each hour forecast once per horizon, the encoder ends at issuance, no step reaches the test period).<br><i>Led to:</i> BiLSTM, the three TFTs and PatchTST read these datasets in W4, with the loss on exactly the rows XGB is trained on.</figcaption></figure><figure class="correction"><label><input type="checkbox" value="C-01"> <b>C-01</b> Daily profile read as UTC and as local time</label><a href="correction/C-01_time_shift_profile.png"><img src="correction/C-01_time_shift_profile.png" alt="Mean hourly AC power of six clear train days per season against the clear-sky power, by true UTC hour (solid) and as the submitted pipeline placed it (dotted, local wall-clock hour read as UTC)." loading="lazy"></a><figcaption>Read as UTC, production appears 2 hours (winter) and 3 hours (summer) after the sun: the clear-day production centre sits 120 and 174 minutes after solar noon, against 1.9 and 2.6 minutes after the conversion.<br><i>Led to:</i> Every v6 result was computed on the shifted data (F-01); the rebuild converts the export to UTC at ingestion and checks the production centre against the sun every month (T-08).</figcaption></figure><figure class="correction"><label><input type="checkbox" value="C-02"> <b>C-02</b> Zero-output daytime hours by label hour</label><a href="correction/C-02_false_downtime.png"><img src="correction/C-02_false_downtime.png" alt="Daytime hours of the submitted forecast file (direct target, D+1) per label hour, split into hours with production and hours with zero output." loading="lazy"></a><figcaption>339 of 2,510 evaluated daytime hours (13.5%) have zero output, and all of them carry the labels 03:00-06:00: local hours before sunrise that the shifted time base counted as daytime. None is a whole-day outage.<br><i>Led to:</i> The disclosure about inverter downtime is rewritten from the corrected data (C-13); real stops are now flagged from the inverter data (F1, F3).</figcaption></figure><figure class="correction"><label><input type="checkbox" value="C-03"> <b>C-03</b> Clear-sky index of the submission and of the rebuild</label><a href="correction/C-03_k_clipping.png"><img src="correction/C-03_k_clipping.png" alt="Share of daytime hours per k bin of 0.05: the submitted file&#x27;s indirect truth (its evaluated test hours) and the rebuild&#x27;s k (valid daytime train hours)." loading="lazy"></a><figcaption>In the submission 16.7% of daytime hours sit exactly at the 1.2 cap and 21.3% near zero; in the rebuild 0.61% exceed 1.2 and none is capped. The pile at the cap came mostly from the time shift: afternoon power divided by morning clear-sky power (F-06).<br><i>Led to:</i> k is now an hourly ratio of means against the panel-plane clear-sky power, never clipped, and converts back to kW exactly (F-06, T-11).</figcaption></figure><figure class="correction"><label><input type="checkbox" value="C-04"> <b>C-04</b> Same-hour windows per horizon, submitted and fixed</label><a href="correction/C-04_rolling_windows.png"><img src="correction/C-04_rolling_windows.png" alt="For each horizon and window length, the days averaged by the submitted code and by the fixed code; red cells are days after the issuance midnight." loading="lazy"></a><figcaption>The submitted windows always started one day before the target day, so at D+2 they included 1 unknown day and at D+3 2 unknown days; the fixed windows end on the last day before issuance at every horizon.<br><i>Led to:</i> Horizon-aware windows (F-07), with a test that plants the submitted window and must fail (T-09, T-18).</figcaption></figure><figure class="correction"><label><input type="checkbox" value="C-05"> <b>C-05</b> Feature selection of the submission: periods and dominance</label><a href="correction/C-05_selection_leaks.png"><img src="correction/C-05_selection_leaks.png" alt="Left: the periods each selection read (submitted: all three; rebuild: train only, validation once at the end). Right: the five largest mean |SHAP| values of the submitted direct-route selection." loading="lazy"></a><figcaption>The submitted selection ran on the whole period, test included. In its direct route the same-hour DC power of the two inverters took 95% of the listed importance, the first 17 times the third feature; they were removed only after the ranking.<br><i>Led to:</i> The rebuild selects on train only and admits features from an allow-list (F-26, F-27).</figcaption></figure><figure class="correction"><label><input type="checkbox" value="C-06"> <b>C-06</b> Submitted weather series: correlation by time shift</label><a href="correction/C-06_weather_alignment.png"><img src="correction/C-06_weather_alignment.png" alt="Hourly correlation of the submitted weather series with the measured clear-sky index for shifts of -3 to +3 hours." loading="lazy"></a><figcaption>The series is the archive value of each target hour, not a forecast issued before midnight. It correlates 0.63 with the measured k after a 1-hour shift (end-of-hour labels), but only 0.30 and 0.27 at the 2- and 3-hour shifts that the time bug produced.<br><i>Led to:</i> The rebuild uses real forecast runs published before issuance and aligned in true UTC (F-28, D-12).</figcaption></figure></main><script>const b=[...document.querySelectorAll('input')];function u(){document.getElementById('ids').textContent=b.filter(x=>x.checked).map(x=>x.value).join(', ')}b.forEach(x=>x.onchange=u)</script></body></html>
